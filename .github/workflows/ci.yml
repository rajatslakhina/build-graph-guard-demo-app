name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: macOS — resolve remote package + build app
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4

      - name: Xcode and Swift versions
        run: |
          xcodebuild -version
          swift --version

      # This is the step that proves the split-repo structure genuinely works:
      # the package is a remote dependency pinned to a published tag, so this
      # resolves against github.com rather than against anything in this checkout.
      - name: Resolve package dependencies
        run: xcodebuild -resolvePackageDependencies -project Demo.xcodeproj

      # Diagnostic only — `Package.resolved` is generated by the step above and its
      # exact location has moved between Xcode versions, so this must never be the
      # reason a build is red.
      - name: Show what was resolved
        continue-on-error: true
        run: find . -name Package.resolved -print -exec cat {} \;

      # `generic/platform=iOS Simulator`, never a named device: pinning to
      # `name=iPhone 16,OS=latest` ties the job to whichever simulator *runtimes*
      # happen to be installed on that day's runner image, and they are not
      # guaranteed. A compile check needs no device to exist.
      - name: Build for iOS Simulator
        run: |
          xcodebuild build \
            -project Demo.xcodeproj \
            -scheme Demo \
            -destination 'generic/platform=iOS Simulator' \
            CODE_SIGNING_ALLOWED=NO
